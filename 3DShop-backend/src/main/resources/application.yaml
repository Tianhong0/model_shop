  server:
    port: 9999 # 后端端口

  spring:
    application:
      name: 3DShop-backend
    profiles:
      active: dev
    servlet:
      multipart:
      # 单个文件的最大限制（例如改为 10MB）
        max-file-size: 1000MB
      # 单次请求的总文件限制（如果有多个文件上传，这个值要比上面大）
        max-request-size: 5000MB
    mail:
      host: smtp.163.com
      port: 465
      username: 15693096384@163.com
      password: ZB8VL33TUWyfh693
      protocol: smtp
      properties:
        mail:
          smtp:
            auth: true
            ssl:
              enable: true

  mybatis-plus:
    type-aliases-package: org.majun.backend.entity
    mapper-locations: classpath:mapper/*.xml
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  # JWT配置
  jwt:
    # 密钥（生产环境请修改为更安全的密钥）
    secret: 3DShop-backend-secret-key-for-jwt-token-generation-please-change-in-production
    # Token过期时间（毫秒），7天
    expiration: 604800000
    # Token头部前缀
    header: Authorization
    # Token前缀
    prefix: "Bearer "

  minio:
    endpoint: http://127.0.0.1:9000
#    endpoint: http://120.48.50.30:9000
    public-endpoint: http://120.48.50.30:9000
    accessKey: admin
    secretKey: a1900574183
    bucketName: shop

  # 自定义切片工具配置
  slicer:
    # Slic3r 可执行文件在 WSL 中的路径
    path: /usr/bin/slic3r
    # 非原生切片格式(如glb/gltf/fbx等)转换工具路径(推荐 assimp)
    converterPath: /usr/bin/assimp
    # 切片工作目录
    workDir: /home/admin/slicer/

  octoprint:
    authHeaderKey: X-Api-Key
    authHeaderValue: "L0SPFG6iweVjbP1MhBHbFUCYHQykacRMf6Oe0Wl76jc"
    connectTimeoutMs: 50000
    readTimeoutMs: 15000
    pollIntervalMs: 5000

  delivery:
    auto-ship-enabled: true
    auto-track-enabled: true
    auto-track-interval-ms: 60000

  # 支付配置
  payment:
    alipay:
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      app-cert-path: ${ALIPAY_APP_CERT_PATH:classpath:cert/alipay/appCertPublicKey.crt}
      alipay-public-cert-path: ${ALIPAY_PUBLIC_CERT_PATH:classpath:cert/alipay/alipayCertPublicKey_RSA2.crt}
      alipay-root-cert-path: ${ALIPAY_ROOT_CERT_PATH:classpath:cert/alipay/alipayRootCert.crt}
      gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
      notify-url: ${ALIPAY_NOTIFY_URL:}
      return-url: ${ALIPAY_RETURN_URL:}
      seller-id: ${ALIPAY_SELLER_ID:}
      timeout-minutes: 30
