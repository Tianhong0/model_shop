spring:
  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://120.48.50.30:3306/model_shop_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: a1900574183

  # Redis 配置
  data:
    redis:
      host: 120.48.50.30
      port: 6379
      password: a1900574183
      database: 0
      timeout: 100000 # 连接超时时间(ms)
      lettuce:
        pool:
          max-active: 8 # 连接池最大连接数
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # RabbitMQ 配置 (3D打印任务异步处理)
  rabbitmq:
    host: 120.48.50.30
    port: 6672
    username: admin
    password: 123456
    virtual-host: /

slicer:
  converterPath: /usr/bin/assimp

payment:
  alipay:
    appId: "9021000159637350"
    privateKey: ""
    appCertPath: "classpath:cert/alipay/appPublicCert.crt"
    alipayPublicCertPath: "classpath:cert/alipay/alipayPublicCert.crt"
    alipayRootCertPath: "classpath:cert/alipay/alipayRootCert.crt"
    gatewayUrl: "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
    notifyUrl: "https://119.84.246.217:40225/api/orders/pay/alipay/notify"
    returnUrl: ""
    sellerId: ""
    signType: RSA2
    charset: UTF-8
    format: json
    timeoutMinutes: 30

octoprint:
  authHeaderKey: X-Api-Key
  authHeaderValue: ${OCTOPRINT_API_KEY:}
  connectTimeoutMs: 5000
  readTimeoutMs: 15000
  pollIntervalMs: 5000

delivery:
  auto-ship-enabled: true
  auto-track-enabled: true
  auto-track-interval-ms: 60000

# AI 智能客服配置
ai:
  enabled: true
  zhipu:
    api-key: ${ZHIPU_API_KEY:94a0955cfdb6470f8d694afcd20d86f1.oNNLQ7IED90Y17pH}
    model: glm-4.5-air
    base-url: https://open.bigmodel.cn/api/paas/v4
    max-tokens: 1024
    temperature: 0.7
    # Embedding 配置（用于语义搜索）
    embedding-model: embedding-3
    embedding-dimension: 1024
  customer-service:
    auto-reply:
      enabled: true
      max-turns: 3
    transfer:
      enabled: true
      keywords:
        - "人工客服"
        - "转人工"
        - "投诉"
        - "退款"
      no-answer-turns: 2
  # 内容审核配置
  content-moderation:
    enabled: true
    post-enabled: true
    reply-enabled: true
    moderate-post-title: true
    moderate-post-content: true
    moderate-reply-content: true
