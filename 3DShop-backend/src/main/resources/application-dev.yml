spring:
  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：在 WSL 中，如果数据库装在 Windows 侧，url 可能需要指向 Windows 的 IP
    # 如果数据库装在 WSL 内部，直接用 localhost 即可
    url: jdbc:mysql://localhost:3306/model_shop_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 5000 # 连接超时时间(ms)
      lettuce:
        pool:
          max-active: 8 # 连接池最大连接数
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # RabbitMQ 配置 (3D打印任务异步处理)
  rabbitmq:
    host: localhost
    port: 6672
    username: admin
    password: 123456
    virtual-host: /

slicer:
  converterPath: /usr/bin/assimp

payment:
  alipay:
    appId: "9021000159637350"
    privateKey: ""
    appCertPath: "classpath:cert/alipay/appPublicCert.crt"
    alipayPublicCertPath: "classpath:cert/alipay/alipayPublicCert.crt"
    alipayRootCertPath: "classpath:cert/alipay/alipayRootCert.crt"
    gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    notifyUrl: "https://119.84.246.217:40225/api/orders/pay/alipay/notify"
    returnUrl: ""
    sellerId: ""
    signType: RSA2
    charset: UTF-8
    format: json
    timeoutMinutes: 30

octoprint:
  authHeaderKey: X-Api-Key
  authHeaderValue: ${OCTOPRINT_API_KEY:}
  connectTimeoutMs: 5000
  readTimeoutMs: 15000
  pollIntervalMs: 5000

delivery:
  auto-ship-enabled: true
  auto-track-enabled: true
  auto-track-interval-ms: 60000

